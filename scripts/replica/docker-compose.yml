services:
  mongo1:
    image: mongo:7.0
    container_name: mongo1
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--port",
        "27017",
        "--auth",
        "--keyFile",
        "/etc/mongo-keyfile"
      ]
    ports:
      - "27017:27017"
    volumes:
      - mongo1-data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - mongo-net
    restart: unless-stopped

  mongo2:
    image: mongo:7.0
    container_name: mongo2
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--port",
        "27017",
        "--auth",
        "--keyFile",
        "/etc/mongo-keyfile"
      ]
    ports:
      - "27018:27017"
    volumes:
      - mongo2-data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - mongo-net
    restart: unless-stopped

  mongo3:
    image: mongo:7.0
    container_name: mongo3
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--port",
        "27017",
        "--auth",
        "--keyFile",
        "/etc/mongo-keyfile"
      ]
    ports:
      - "27019:27017"
    volumes:
      - mongo3-data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - mongo-net
    restart: unless-stopped

networks:
  mongo-net:

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
